<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Leeool Bar Prep</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f0e0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Leeool Bar">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root {
  --bg: #0f0e0c;
  --color-background-primary: #1a1916;
  --color-background-secondary: #222120;
  --color-background-tertiary: #2a2927;
  --color-background-success: rgba(90,143,106,0.15);
  --color-background-warning: rgba(196,127,58,0.15);
  --color-background-danger: rgba(168,85,85,0.15);
  --color-text-primary: #e8e4dc;
  --color-text-secondary: #a09b90;
  --color-text-tertiary: #6b6560;
  --color-text-success: #5a8f6a;
  --color-text-warning: #c47f3a;
  --color-text-danger: #a85555;
  --color-border-primary: #3d3c39;
  --color-border-secondary: #333230;
  --color-border-tertiary: #2a2927;
  --color-border-success: rgba(90,143,106,0.5);
  --color-border-warning: rgba(196,127,58,0.5);
  --color-border-danger: rgba(168,85,85,0.5);
  --font-sans: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
  --font-mono: 'SF Mono', SFMono-Regular, Consolas, monospace;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:var(--bg);color:var(--color-text-primary);font-family:var(--font-sans)}
body{max-width:680px;margin:0 auto;padding:0 1rem 2rem}
.app{padding:.75rem 0}
.hdr{display:flex;align-items:baseline;gap:.6rem;padding-bottom:.8rem;border-bottom:0.5px solid var(--color-border-tertiary);margin-bottom:1rem}
.logo{font-size:1.15rem;font-weight:500;color:var(--color-text-primary)}
.subj-tag{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-tertiary);border:0.5px solid var(--color-border-tertiary);padding:2px 8px;border-radius:20px}
.tabs{display:flex;gap:4px;margin-bottom:1rem}
.tab{font-size:.8rem;padding:6px 14px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:transparent;color:var(--color-text-secondary);cursor:pointer;font-family:var(--font-sans)}
.tab.on{background:var(--color-background-secondary);border-color:var(--color-border-primary);color:var(--color-text-primary)}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:1.25rem;margin-bottom:.8rem}
.cmeta{display:flex;gap:7px;align-items:center;margin-bottom:.8rem;flex-wrap:wrap}
.freq{font-size:.68rem;font-weight:500;padding:2px 8px;border-radius:20px;border:0.5px solid;text-transform:uppercase}
.freq.high{background:var(--color-background-danger);border-color:var(--color-border-danger);color:var(--color-text-danger)}
.freq.mid{background:var(--color-background-warning);border-color:var(--color-border-warning);color:var(--color-text-warning)}
.freq.low{background:var(--color-background-success);border-color:var(--color-border-success);color:var(--color-text-success)}
.ctag{font-size:.68rem;color:var(--color-text-tertiary);border:0.5px solid var(--color-border-tertiary);padding:2px 7px;border-radius:20px}
.cnum{font-size:.68rem;color:var(--color-text-tertiary);margin-left:auto;font-family:var(--font-mono)}
.issue{font-size:1.1rem;font-weight:500;color:var(--color-text-primary);margin-bottom:.8rem;line-height:1.3}
.flip-wrap{cursor:pointer;perspective:1000px;margin-bottom:.5rem}
.flip-inner{position:relative;min-height:220px;transform-style:preserve-3d;transition:transform .45s}
.flip-inner.flipped{transform:rotateY(180deg)}
.flip-face{position:absolute;width:100%;min-height:220px;backface-visibility:hidden;background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:1.25rem;display:flex;flex-direction:column}
.flip-back{transform:rotateY(180deg)}
.flbl{font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--color-text-tertiary);margin-bottom:.5rem}
.fissue{font-size:1.2rem;font-weight:500;color:var(--color-text-primary);flex:1;display:flex;align-items:center;line-height:1.3}
.fhint{font-size:.72rem;color:var(--color-text-tertiary);text-align:center;margin-top:1rem}
.frule{font-size:.875rem;line-height:1.75;color:var(--color-text-secondary);flex:1;overflow-y:auto;max-height:280px}
.frule p{margin-bottom:.4rem}
.frule strong{color:var(--color-text-primary);font-weight:500}
.frule em{font-style:italic}
.frule ol,.frule ul{padding-left:1.3rem;margin-bottom:.4rem}
.frule li{margin-bottom:.2rem}
.ex-lbl{font-size:.63rem;letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-tertiary);margin-bottom:.3rem;margin-top:.8rem}
.ex-val{font-size:.8rem;line-height:1.5;color:var(--color-text-secondary);font-family:var(--font-mono)}
.note-lbl{font-size:.63rem;letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-tertiary);margin-top:.8rem;margin-bottom:.3rem;padding-top:.8rem;border-top:0.5px solid var(--color-border-tertiary)}
.note-area{width:100%;min-height:55px;font-family:var(--font-sans);font-size:.82rem;padding:8px 10px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-secondary);color:var(--color-text-primary);resize:vertical;outline:none;display:block}
.note-area:focus{border-color:var(--color-border-primary)}
.note-btn{font-size:.72rem;padding:4px 12px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:transparent;color:var(--color-text-secondary);cursor:pointer;font-family:var(--font-sans);margin-top:5px}
.note-btn:hover{color:var(--color-text-primary)}
.srs{font-size:.7rem;color:var(--color-text-tertiary);text-align:center;margin-bottom:.5rem}
.rlbl{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-tertiary);margin-bottom:.4rem}
.rinp{width:100%;min-height:110px;font-family:var(--font-sans);font-size:.875rem;line-height:1.6;padding:10px 12px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-secondary);color:var(--color-text-primary);resize:vertical;outline:none;display:block}
.rinp:focus{border-color:var(--color-border-primary)}
.ckbtn{font-family:var(--font-sans);font-size:.82rem;padding:8px 18px;border:0.5px solid var(--color-border-primary);border-radius:var(--border-radius-md);background:var(--color-background-secondary);color:var(--color-text-primary);cursor:pointer;margin-top:8px}
.ckbtn:hover{background:var(--color-background-tertiary)}
.ckbtn:disabled{opacity:.4;cursor:not-allowed}
.fb{margin-top:1rem;border-radius:var(--border-radius-md);overflow:hidden}
.fbtop{padding:12px 16px;display:flex;align-items:center;gap:14px}
.fbtop.g{background:var(--color-background-success);border:0.5px solid var(--color-border-success)}
.fbtop.p{background:var(--color-background-warning);border:0.5px solid var(--color-border-warning)}
.fbtop.m{background:var(--color-background-danger);border:0.5px solid var(--color-border-danger)}
.fbpct{font-size:1.8rem;font-weight:500;font-family:var(--font-mono)}
.fbpct.g{color:var(--color-text-success)}
.fbpct.p{color:var(--color-text-warning)}
.fbpct.m{color:var(--color-text-danger)}
.fbv{font-size:.9rem;font-weight:500;color:var(--color-text-primary)}
.fbs2{font-size:.78rem;color:var(--color-text-secondary);margin-top:2px}
.fbbody{padding:12px 16px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-top:none}
.kl{font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-tertiary);margin-bottom:.35rem;margin-top:.5rem}
.kl:first-child{margin-top:0}
.ktags{display:flex;flex-wrap:wrap;gap:4px}
.ktag{font-size:.7rem;padding:2px 8px;border-radius:20px;border:0.5px solid}
.ktag.h{background:var(--color-background-success);border-color:var(--color-border-success);color:var(--color-text-success)}
.ktag.m2{background:var(--color-background-danger);border-color:var(--color-border-danger);color:var(--color-text-danger);opacity:.8}
.again{font-size:.8rem;padding:.5rem .8rem;margin-top:.6rem;background:var(--color-background-warning);border:0.5px solid var(--color-border-warning);color:var(--color-text-warning);border-radius:var(--border-radius-md)}
.rbox{margin-top:.8rem;padding:12px 14px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md)}
.rboxlbl{font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--color-text-tertiary);margin-bottom:.5rem}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:.8rem}
.navbtn{font-size:.8rem;padding:7px 16px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:transparent;color:var(--color-text-secondary);cursor:pointer;font-family:var(--font-sans)}
.navbtn:hover{color:var(--color-text-primary);border-color:var(--color-border-primary)}
.navctr{flex:1;text-align:center;font-size:.8rem;color:var(--color-text-tertiary);font-family:var(--font-mono)}
.acts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.actbtn{font-size:.78rem;padding:7px 16px;border-radius:var(--border-radius-md);border:0.5px solid;cursor:pointer;font-family:var(--font-sans);font-weight:500}
.actbtn.ms{background:var(--color-background-success);border-color:var(--color-border-success);color:var(--color-text-success)}
.actbtn.rv{background:var(--color-background-warning);border-color:var(--color-border-warning);color:var(--color-text-warning)}
.actbtn.du{background:var(--color-background-danger);border-color:var(--color-border-danger);color:var(--color-text-danger)}
</style>
</head>
<body>
<div class="app">
<div class="hdr">
  <div class="logo">Leeool Bar Prep</div>
  <div class="subj-tag">Evidence</div>
</div>
<div class="tabs">
  <button class="tab on" id="tabFlip">Flashcard</button>
  <button class="tab" id="tabRecall">Recall</button>
</div>

<!-- FLASHCARD -->
<div id="modeFlip">
  <div class="flip-wrap" id="flipWrap">
    <div class="flip-inner" id="flipInner">
      <div class="flip-face">
        <div class="cmeta">
          <span class="freq" id="fFreq1">High</span>
          <span class="ctag">Evidence</span>
          <span class="cnum" id="fNum1">#1</span>
        </div>
        <div class="flbl">Issue</div>
        <div class="fissue" id="fIssue">—</div>
        <div class="fhint">tap to reveal rule →</div>
      </div>
      <div class="flip-face flip-back">
        <div class="cmeta">
          <span class="freq" id="fFreq2">High</span>
          <span class="ctag">Evidence</span>
          <span class="cnum" id="fNum2">#1</span>
        </div>
        <div class="flbl">Rule</div>
        <div class="frule" id="fRule"></div>
        <div id="fExtras"></div>
        <div class="note-lbl">My Notes</div>
        <textarea class="note-area" id="noteArea" placeholder="Add your notes here..."></textarea>
        <button class="note-btn" id="noteBtn">Save note</button>
      </div>
    </div>
  </div>
  <div class="srs" id="srsChip"></div>
</div>

<!-- RECALL -->
<div id="modeRecall" style="display:none">
  <div class="card">
    <div class="cmeta">
      <span class="freq" id="rFreq">High</span>
      <span class="ctag">Evidence</span>
      <span class="cnum" id="rNum">#1</span>
    </div>
    <div class="issue" id="rIssue">—</div>
    <div class="rlbl">Write out the key elements from memory</div>
    <textarea class="rinp" id="rInp" placeholder="Type the rule here..."></textarea>
    <button class="ckbtn" id="ckBtn">Check answer</button>
    <div id="fbWrap" style="display:none">
      <div class="fb">
        <div class="fbtop" id="fbTop">
          <div class="fbpct" id="fbPct">0%</div>
          <div>
            <div class="fbv" id="fbV"></div>
            <div class="fbs2" id="fbS"></div>
          </div>
        </div>
        <div class="fbbody">
          <div class="kl">Covered ✓</div>
          <div class="ktags" id="kwH"></div>
          <div class="kl">Missing ✗</div>
          <div class="ktags" id="kwM"></div>
          <div class="again" id="againEl" style="display:none">Below 80% — this card will repeat in this session.</div>
        </div>
      </div>
      <div class="rbox">
        <div class="rboxlbl">Full Rule</div>
        <div class="frule" id="rRuleBody"></div>
      </div>
    </div>
  </div>
</div>

<div class="nav">
  <button class="navbtn" id="prevBtn">← Prev</button>
  <div class="navctr" id="navCtr">1 / 46</div>
  <button class="navbtn" id="nextBtn">Next →</button>
</div>
<div class="acts">
  <button class="actbtn ms" id="btnMs">✓ Mastered</button>
  <button class="actbtn rv" id="btnRv">↺ Review</button>
  <button class="actbtn du" id="btnDu">! Due today</button>
</div>
</div>

<script>
var CARDS = [{"id":"1","issue":"Relevance","rule":"To be admissible, evidence must be both logically and legally relevant.\n\nThe **logical relevance** is established if the evidence has any tendency to make a fact more or less probable than it would be without the evidence, and the fact is of consequence in determining the action.\n\nThe **legal relevance** requires that its probative value is not substantially outweighed by the risk of unfair prejudice, confusing the issue, misleading the jury, undue delay, waste of time, or needless presentation of cumulative evidence.","freq":"high","kws":["logical relevance","any tendency to make a fact more or less probable","fact of consequence","legal relevance","probative value substantially outweighed by prejudicial effect"],"mn":"\u504f\u8bef\u6742\u8d39\u6162\u91cd\u590d","tr":"\u6240\u6709\u8bc1\u636e\u6cd5\u9898\u76ee\uff0c\u9488\u5bf9\u6bcf\u4e00\u4e2a\u8bc1\u636e\u90fd\u8981\u5199\u7684issue\u70b9"},{"id":"2","issue":"CEC Rule \u2013 California Proposition 8","rule":"In criminal cases, all relevant evidence shall not be excluded unless:\n1. Limits on prosecution offering specific character evidence\n2. Evidence barred under Rape-shield statutes\n3. CEC 352\n4. Secondary evidence rule\n5. Hearsay rule\n6. Exclusionary rules based upon the US Constitution\n7. Privileges exclusions","freq":"high","kws":["all relevant evidence shall not be excluded","character evidence","rape-shield rule","CEC 352","Secondary evidence","hearsay","US Constitution","privilege"],"mn":"DR Mammal Counts SHEEP","tr":"\u53ea\u8981\u8003\u52a0\u5dde\u8bc1\u636e\u6cd5\uff0c\u90fd\u8981\u5199\u3002"},{"id":"3","issue":"Subsequent Remedial Measures","rule":"Evidence of measures taken after an injury is **not admissible** to prove negligence, culpable conduct, product defect and need for a warning.\n\n**Admissible** to prove: ownership, control, feasibility of precautionary measures, or for impeachment.","freq":"med","kws":["not admissible to prove negligence","culpable conduct","product defect","need for a warning","admissible to prove ownership","control","feasibility of precautionary measures","or for impeachment"],"mn":"","tr":""},{"id":"4","issue":"Settlement Negotiations","rule":"Evidence of offering, accepting, or statements made during settlement negotiations **about a disputed claim** is not admissible to prove liability or the amount of the claim.\n\nAdmissible to prove bias, prejudice, delay, or obstruction of a criminal investigation.","freq":"med","kws":["about a disputed claim","not admissible to prove liability","amount of claim","admissble to prove bias","prejudice of a witness"],"mn":"","tr":""},{"id":"5","issue":"Payment of Medical Expenses","rule":"Evidence of offering to pay medical expenses is **not admissible** to prove liability.\n\n- **FRE**: accompanying factual admissions are admissible\n- **CA**: related factual statements are not admissible","freq":"med","kws":["not admissible to prove liability for the injury","accompanying admissions are admissible (FRE)","fatual statements are not admissible (CA)"],"mn":"","tr":""},{"id":"6","issue":"Plea Bargaining","rule":"Evidence of a withdrawn guilty plea, nolo contendere, or statements during plea discussions is **inadmissible** against the defendant.\n\nExceptions: perjury prosecution, or fairness requires.","freq":"low","kws":["inadmissible against the defendant","admitted in a perjury prosecution","fairness requires"],"mn":"","tr":""},{"id":"7","issue":"Liability Insurance","rule":"Evidence of insurance is **not admissible** to prove culpable conduct.\n\n**Admissible** to prove: ownership, control, or bias of a witness.","freq":"med","kws":["not admissible to prove culpable conduct","admissible to prove ownership","control","bias"],"mn":"","tr":""},{"id":"8","issue":"Attorney-Client Privilege","rule":"Protects confidential communications if:\n1. Made **for the purpose of obtaining legal advice**\n2. Communication was **confidential**\n\n**Does not apply**: crime/fraud, attorney-client disputes, joint clients.\n\nHeld by the **client**; survives death; client may waive.","freq":"high","kws":["for the purpose of obtaining legal advice","communication was confidential","does not apply","crime or fraud","in attorney-client disputes","joint clients","held by the client","survives death","client may waive"],"mn":"","tr":""},{"id":"9","issue":"Attorney Work Product Doctrine","rule":"**FRE**: Protects materials prepared **by or for an attorney** in anticipation of litigation. Not discoverable without **substantial need and undue hardship**.\n\n**CA**:\n- Absolute: attorney impressions/notes/opinions\n- Qualified: other materials, discoverable upon showing need","freq":"high","kws":["by or for an attorney","in anticipation of litigation","substantial need","undue hardship","attorney impressions","notes or opinions","absolutely protected"],"mn":"","tr":""},{"id":"10","issue":"Confidential Marital Communications Privilege","rule":"Protects private communications made **during a valid marriage** intended to be confidential.\n\nHeld by **both spouses**; survives divorce.","freq":"med","kws":["during a valid marriage","intended to be confidential","held by both spouses","survives divorce"],"mn":"","tr":""},{"id":"11","issue":"Spousal Immunity Privilege","rule":"**FRE**: Spouse cannot be compelled to testify against the other in a **criminal case**. Held by the **testifying spouse**; ends upon divorce.\n\n**CA**: applies in both civil and criminal cases.","freq":"med","kws":["FRE","criminal case","testifying spouse","ends upon divorce","CA civil and criminal cases"],"mn":"","tr":""},{"id":"12","issue":"Hearsay \u2014 Definition","rule":"**Hearsay** = out-of-court statement offered to prove the **truth of the matter asserted**. **Not admissible** unless an exception applies.\n\nStatement = oral assertion, written assertion, or non-verbal conduct intended as assertion.\n\n**Hearsay within hearsay**: each layer must independently qualify.","freq":"high","kws":["out-of-court statement","truth of the matter asserted","not admissible","oral assertion","written assertion","non-verbal conduct","hearsay within hearsay"],"mn":"","tr":""},{"id":"13","issue":"Non-Hearsay Purposes","rule":"Statement offered for something **other than the truth** is non-hearsay.\n\nCommon purposes:\n1. Independent legal significance\n2. Impeachment\n3. Effect on the listener\n4. Circumstantial evidence of state of mind","freq":"high","kws":["other than the truth","independent legal significance","effect on the listener","state of mind"],"mn":"","tr":""},{"id":"14","issue":"Prior Identification","rule":"Prior identification is admissible if the **declarant testifies at trial** and is **subject to cross-examination**.","freq":"med","kws":["declarant testifies at trial","subject to cross-examination"],"mn":"","tr":""},{"id":"15","issue":"Opposing Party's Statement","rule":"Not hearsay if offered against an opposing party as:\n1. Party's **own statement**\n2. **Adoptive admission** by silence\n3. **Authorized speaker**\n4. **Agent or employee** within scope\n5. **Co-conspirator** during/in furtherance of conspiracy","freq":"high","kws":["own statement","adoptive admission","by silence","authorized speaker","by agent or employee","by co-conspirator"],"mn":"","tr":""},{"id":"16","issue":"Declarant Unavailability","rule":"Declarant is **unavailable** if:\n- Claims a privilege\n- Refuses to testify despite court order\n- Lacks memory\n- Death or illness\n- Cannot be procured by process or reasonable means\n\nUnavailability must not be caused by either party.","freq":"high","kws":["privilege","refuse","lack memory","death or ill","cannot be procured"],"mn":"","tr":""},{"id":"17","issue":"Former Testimony","rule":"Admissible if:\n1. Declarant **unavailable**\n2. Testimony at **prior proceeding or deposition**\n3. **Same issues** involved\n4. **Same motive and opportunity** to cross-examine\n\n- FRE civil: same party or predecessor in interest\n- CA civil: person with similar interest\n- Criminal: defendant personally must have had same motive","freq":"mid","kws":["unavailable","prior proceeding or deposition","same issues","same motive and opportunity","predecessor in interest","similar interest"],"mn":"","tr":""},{"id":"18","issue":"Dying Declaration","rule":"Admissible if:\n1. Declarant **unavailable**\n2. Statement under **belief of imminent death**\n3. Statement concerns **cause or circumstances** of impending death\n\n- FRE: homicide and civil cases only\n- CA: admissible in all cases","freq":"mid","kws":["unavailable","belief of imminent death","cause or circumstances","homicide prosecutions and civil cases"],"mn":"","tr":""},{"id":"19","issue":"Statement Against Interest","rule":"Admissible if:\n1. Declarant **unavailable**\n2. Against declarant's **pecuniary, proprietary, or penal interest**\n3. **Reasonable person** would not have made it unless believed true\n4. Declarant has **firsthand knowledge**\n\nCA: includes societal interests\nFRE criminal: requires corroborating evidence","freq":"high","kws":["unavailable","pecuniary","proprietary","penal interest","reasonable person","believed it to be true","firsthand knowledge","corroborating evidence"],"mn":"","tr":""},{"id":"20","issue":"Present Sense Impression","rule":"Admissible if:\n1. Statement **describes or explains** an event\n2. Made **while perceiving** the event or immediately thereafter\n\nCA: contemporaneous statement \u2014 only declarant's own conduct while engaged in it.","freq":"high","kws":["describe or explain an event","while perceiving","immediately thereafter","contemporaneous statement","own conduct"],"mn":"","tr":""},{"id":"21","issue":"Excited Utterance","rule":"Admissible if:\n1. A **startling event** occurred\n2. Statement **relates to** the event\n3. Made **under the stress of excitement**\n\nCA: called spontaneous statement.","freq":"high","kws":["startling event","relates to","under the stress of excitement","spontaneous statement"],"mn":"","tr":""},{"id":"22","issue":"Then-Existing State of Mind","rule":"Statement of declarant's **then-existing state of mind** (intent, plan, motive) or emotion/sensory/physical condition is admissible.\n\n**Does not apply** to statements of memory or belief.","freq":"high","kws":["then-existing state of mind","intent","plan","motive","does not apply to statement of memory or belief"],"mn":"","tr":""},{"id":"23","issue":"Medical Diagnosis or Treatment Statements","rule":"Admissible if made **for and reasonably pertinent to** medical diagnosis or treatment, describing medical history or symptoms.\n\nDoes not include statements of fault.","freq":"med","kws":["made for and reasonably pertinent to","medical diagnosis or treatment","describes medical history"],"mn":"","tr":""},{"id":"24","issue":"Past Recollection Recorded","rule":"Admissible if:\n1. Witness once had **personal knowledge**\n2. Witness **no longer remembers**\n3. Record made when **fresh in the mind**\n4. Record is **accurate**\n\nMay be read into evidence but only received as exhibit if offered by adverse party.","freq":"med","kws":["personal knowledge","no longer remember","fresh in the mind","accurate","read into evidence","adverse party"],"mn":"","tr":""},{"id":"25","issue":"Business Records","rule":"Admissible if:\n1. Made **at or near the time** of the event\n2. Made by person with **knowledge**\n3. Kept in **ordinary course** of business\n4. **Regular practice** to make such records\n\nCEC: does not include opinions or diagnoses.","freq":"high","kws":["at or near the time","ordinary course of business","regular practice"],"mn":"","tr":""},{"id":"26","issue":"Public Records","rule":"FRE admissible if describing:\n1. Policies and practices of public office\n2. Observations made under duty\n3. Factual findings from authorized investigation\n\nException: criminal cases cannot use police officer observations against defendant.\n\nCA: scope of duty + near the time + trustworthiness.","freq":"med","kws":["policies and practices","observations made under duty","factual findings","police officers against criminal defendant","scope of duty","trustworthiness"],"mn":"","tr":""},{"id":"27","issue":"Character Evidence \u2014 General Rule","rule":"Character evidence is **not admissible** to prove propensity, unless for **non-propensity purposes** or when **character is in issue**.\n\n- Reputation or Opinion: admissible in all instances\n- Specific Acts: only when character in issue, or on cross-examination","freq":"high","kws":["not admissible to prove propensity","non-propensity purposes","character in issue","reputation or opinion","specific acts","cross-examination"],"mn":"Direct = Rep/Opinion only; Cross = Can ask specific; No extrinsic; Unless issue/MIMIC/sex crimes","tr":""},{"id":"28","issue":"Character Evidence \u2014 Criminal Case","rule":"Defendant's character: D may offer own character; prosecution may rebut only if D opens the door.\n\nVictim's character:\n- General: D may offer; prosecution may rebut\n- Homicide: prosecution may offer victim's peacefulness if D claims victim was first aggressor\n- Sex offense: victim's sexual behavior generally inadmissible except past conduct with D, another caused injury, or constitutional rights","freq":"high","kws":["defendant may offer own character","prosecution cannot offer unless defendant opens door","victim character","first aggressor","victim peacefulness","sex offense","past conduct with defendant"],"mn":"","tr":""},{"id":"29","issue":"Character Evidence \u2014 Civil Cases","rule":"Character evidence **cannot** prove propensity in civil cases.\n\nSex-offense exception: only if probative value **substantially outweighs** risk of harm.\n\nReputation evidence only if victim put reputation in issue.","freq":"high","kws":["cannot prove propensity","sex-offense exception","substantially outweighs","reputation in issue"],"mn":"","tr":""},{"id":"30","issue":"Prior Bad Acts \u2014 MIMIC Rule","rule":"Other crimes/wrongs/acts **not admissible** to show propensity.\n\nAdmissible for non-propensity purposes:\n- Motive\n- Intent\n- Absence of Mistake\n- Identity\n- Common plan/scheme","freq":"high","kws":["not admissible to show propensity","motive","intent","mistake","identity","common plan"],"mn":"MIMIC","tr":""},{"id":"31","issue":"Habit and Routine Practice","rule":"Habit evidence admissible to show a person acted in conformity with the habit.\n\nHabit = regular response to a repeated specific situation, almost automatic.\n\nRoutine practice of an organization treated the same.","freq":"low","kws":["regular response","repeated situation","automatic","routine practice"],"mn":"","tr":""},{"id":"32","issue":"Lay Witness Competency","rule":"Lay witness must be **competent** and have **personal knowledge**.\n\nCompetency requires:\n- Oath to tell the truth\n- Capacity to perceive, recall, and communicate\n\nFRE: presumed competent except presiding judges and jurors.\nCA: must understand legal duty to tell truth.","freq":"high","kws":["competent","personal knowledge","oath","capacity to perceive","recall","communicate","presumed competent","legal duty"],"mn":"","tr":""},{"id":"33","issue":"Lay Opinion Rule","rule":"Lay witness may give opinion if:\n1. Rationally based on **own perception**\n2. **Helpful** to understanding testimony or determining a fact in issue\n3. Not based on scientific or specialized knowledge (FRE)","freq":"high","kws":["own perception","helpful","not based on scientific or specialized knowledge"],"mn":"","tr":""},{"id":"34","issue":"Expert Opinion Rule","rule":"Expert may testify if:\n1. **Qualified** by knowledge, skill, experience, training, or education\n2. Based on **sufficient facts or data**\n3. Product of **reliable principles and methods**\n4. Expert **reliably applied** those principles\n\nFRE: Daubert/Kumho \u2014 reliability of methodology\nCA: Kelly/Frye \u2014 general acceptance in scientific community","freq":"high","kws":["qualified","sufficient facts or data","reliable principles and methods","reliably applied","Daubert","Kelly/Frye","general acceptance"],"mn":"","tr":""},{"id":"35","issue":"Refreshing Recollection","rule":"Witness may use a writing to refresh memory if:\n1. Witness once had **personal knowledge**\n2. Witness currently **does not recall fully**\n3. Writing shown **solely to jog memory**\n4. Testimony comes from witness's **own recollection**","freq":"med","kws":["personal knowledge","does not recall fully","solely to jog memory","own recollection"],"mn":"","tr":""},{"id":"36","issue":"Trial Objections","rule":"- Narrative: calls for unfocused story\n- Unresponsive: answer doesn't directly respond\n- Compound: asks multiple things at once\n- Argumentative: designed to argue\n- Leading: suggests the answer; permitted on cross, not direct\n- Assumes facts not in evidence\n- Speculation: calls for a guess\n\nCA: leading on direct only in interests of justice","freq":"med","kws":["narrative","unresponsive","compound","argumentative","leading questions","cross examination","assumes facts not in evidence","speculation","interests of justice"],"mn":"NUCALF","tr":""},{"id":"37","issue":"Impeachment \u2014 General Rule","rule":"Witness may be impeached by:\n- Prior inconsistent statements\n- Prior bad acts\n- Prior convictions\n- Bias\n- Character for untruthfulness\n- Defects in perception or memory","freq":"high","kws":["prior inconsistent statements","prior bad acts","prior convictions","bias","character for untruthfulness","perception or memory"],"mn":"","tr":""},{"id":"38","issue":"Impeachment \u2014 Prior Inconsistent Statement","rule":"PIS admissible to **impeach**.\n\nExtrinsic evidence admissible only if relevant to material issue AND witness given opportunity to explain or deny.\n\nFRE: PIS admissible for truth only if made **under oath** at prior proceeding.\nCA: PIS admissible for both impeachment and truth, regardless of oath.","freq":"high","kws":["admissible to impeach","extrinsic evidence","material issue","opportunity to explain or deny","admissible for truth","under oath","both impeachment and truth"],"mn":"","tr":""},{"id":"39","issue":"Impeachment \u2014 Prior Criminal Convictions","rule":"FRE:\n1. Felonies not involving dishonesty: admissible if witness not defendant (FRE 403); if defendant, only if probative outweighs prejudice\n2. Dishonesty convictions: always admissible\n3. Older than 10 years: not admissible unless probative substantially outweighs AND proper notice\n\nCA: moral turpitude felonies in civil and criminal; misdemeanors in criminal only (Prop 8)","freq":"med","kws":["felonies not involving dishonesty","probative outweighs prejudice","dishonesty always admissible","10 years","proper notice","moral turpitude"],"mn":"","tr":""},{"id":"40","issue":"Impeachment \u2014 Specific Acts","rule":"May be asked on **cross-examination only** if probative of character for truthfulness.\n\n**Extrinsic evidence never admissible** \u2014 must take witness's answer.\n\nCA: generally inadmissible. Prop 8: moral turpitude acts may be used; extrinsic evidence allowed on cross.","freq":"med","kws":["cross-examination only","extrinsic evidence never admissible","moral turpitude","prop 8"],"mn":"","tr":""},{"id":"41","issue":"Bias","rule":"Evidence of **bias or interest** is always relevant and may be proved by **extrinsic evidence**.","freq":"low","kws":["bias or interest","always relevant","extrinsic evidence allowed"],"mn":"","tr":""},{"id":"42","issue":"Authentication \u2014 General Rule","rule":"Evidence is admissible only if **authenticated**.\n\nSatisfied by evidence sufficient to **support a finding** that the item is what the proponent claims.","freq":"high","kws":["authenticated","evidence sufficient","support a finding","what proponent claims"],"mn":"","tr":""},{"id":"43","issue":"Authentication \u2014 Physical Evidence","rule":"Authenticated by:\n1. Testimony of **witness with knowledge**\n2. **Distinctive characteristic** or **chain of custody**","freq":"high","kws":["witness with knowledge","distinctive characteristic","chain of custody"],"mn":"","tr":""},{"id":"44","issue":"Authentication \u2014 Voice Recording","rule":"Voice authenticated by **opinion testimony** of a witness familiar with the voice, from hearing it **at any time**.","freq":"med","kws":["opinion testimony","witness familiar with voice","at any time"],"mn":"","tr":""},{"id":"45","issue":"Best Evidence Rule","rule":"To prove the **content** of a writing, recording, or photograph, the **original is required**.\n\nDuplicate admissible unless: genuine question about authenticity, or unfair.\n\nCA: Duplicates generally not admissible unless copy is accurate and valid reason for missing original.","freq":"high","kws":["prove content","writing","recording","original required","duplicate","authenticity","CA duplicate inadmissible"],"mn":"","tr":""},{"id":"46","issue":"Judicial Notice","rule":"Court may take judicial notice of **indisputable facts** that are:\n1. Commonly known in the community\n2. Readily capable of verification\n\nMay be taken at any stage.\n\nFRE civil: conclusive. FRE criminal: jury may or may not accept.\nCA: conclusive in both civil and criminal cases.","freq":"med","kws":["indisputable facts","commonly known","readily capable of verification","any stage","FRE civil conclusive","CA conclusive"],"mn":"","tr":""}];

var idx = 0;
var SRS = [1,2,4,7,14,30,60];
var isFlipped = false;
var curMode = 'flip';

function getState(id) {
  try { var s = localStorage.getItem('lb_'+id); return s ? JSON.parse(s) : {status:'due',interval:0,note:''}; } catch(e) { return {status:'due',interval:0,note:''}; }
}
function setState(id, data) {
  try { localStorage.setItem('lb_'+id, JSON.stringify(data)); } catch(e) {}
}

function norm(s) {
  return s.toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
}
function kwMatch(input, kw) {
  var ni = norm(input), nk = norm(kw);
  if (ni.indexOf(nk) >= 0) return true;
  var words = nk.split(' ').filter(function(w){ return w.length > 3; });
  if (words.length >= 2) {
    var hits = words.filter(function(w){ return ni.indexOf(w) >= 0; });
    if (hits.length / words.length >= 0.6) return true;
  }
  return false;
}

function renderMd(text) {
  if (!text) return '';
  var lines = text.split('\n');
  var out = [], inOl = false, inUl = false;
  function inl(s) {
    return s.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>')
            .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
            .replace(/\*(.+?)\*/g,'<em>$1</em>');
  }
  function cl() {
    if (inOl) { out.push('</ol>'); inOl=false; }
    if (inUl) { out.push('</ul>'); inUl=false; }
  }
  for (var i=0;i<lines.length;i++) {
    var t=lines[i].trim();
    if (!t) { cl(); out.push('<div style="height:.3rem"></div>'); continue; }
    if (/^---+$/.test(t)) { cl(); out.push('<hr style="border:none;border-top:0.5px solid var(--color-border-tertiary);margin:.5rem 0">'); continue; }
    var olm=t.match(/^(\d+)\.\s+(.*)/);
    if (olm) { if(inUl){out.push('</ul>');inUl=false;} if(!inOl){out.push('<ol>');inOl=true;} out.push('<li>'+inl(olm[2])+'</li>'); continue; }
    var ulm=t.match(/^[-*]\s+(.*)/);
    if (ulm) { if(inOl){out.push('</ol>');inOl=false;} if(!inUl){out.push('<ul>');inUl=true;} out.push('<li>'+inl(ulm[1])+'</li>'); continue; }
    cl(); out.push('<p>'+inl(t)+'</p>');
  }
  cl();
  return out.join('');
}

function setFreqEl(id, freq) {
  var el = document.getElementById(id);
  var lbl = freq==='high'?'High':freq==='low'?'Low':'Mid';
  var cls = freq==='high'?'high':freq==='low'?'low':'mid';
  el.textContent = lbl;
  el.className = 'freq '+cls;
}

function render() {
  var c = CARDS[idx];
  var st = getState(c.id);
  setFreqEl('fFreq1', c.freq); setFreqEl('fFreq2', c.freq); setFreqEl('rFreq', c.freq);
  document.getElementById('fNum1').textContent = '#'+c.id;
  document.getElementById('fNum2').textContent = '#'+c.id;
  document.getElementById('rNum').textContent = '#'+c.id;
  document.getElementById('fIssue').textContent = c.issue;
  document.getElementById('rIssue').textContent = c.issue;
  document.getElementById('fRule').innerHTML = renderMd(c.rule);
  document.getElementById('navCtr').textContent = (idx+1)+' / '+CARDS.length;
  var extras = '';
  if (c.mn) extras += '<div><div class="ex-lbl">Mnemonic</div><div class="ex-val">'+c.mn.replace(/\n/g,'<br>')+'</div></div>';
  if (c.tr) extras += '<div style="margin-top:.5rem"><div class="ex-lbl">Trigger</div><div style="font-size:.8rem;line-height:1.5;color:var(--color-text-secondary)">'+c.tr.replace(/\n/g,'<br>')+'</div></div>';
  document.getElementById('fExtras').innerHTML = extras ? '<div style="margin-top:.8rem;padding-top:.8rem;border-top:0.5px solid var(--color-border-tertiary)">'+extras+'</div>' : '';
  document.getElementById('noteArea').value = st.note || '';
  var srsMap = {mastered:'Mastered · next in '+st.interval+'d', review:'Queued for review', due:'Due today'};
  document.getElementById('srsChip').textContent = srsMap[st.status] || '';
  document.getElementById('rInp').value = '';
  document.getElementById('fbWrap').style.display = 'none';
  document.getElementById('ckBtn').disabled = false;
  document.getElementById('ckBtn').style.opacity = '1';
  isFlipped = false;
  document.getElementById('flipInner').classList.remove('flipped');
}

document.getElementById('flipWrap').addEventListener('click', function() {
  isFlipped = !isFlipped;
  document.getElementById('flipInner').classList.toggle('flipped', isFlipped);
});

document.getElementById('ckBtn').addEventListener('click', function() {
  var c = CARDS[idx];
  var input = document.getElementById('rInp').value;
  var kws = c.kws || [];
  var hits = [], misses = [];
  for (var i=0;i<kws.length;i++) {
    if (kwMatch(input,kws[i])) hits.push(kws[i]); else misses.push(kws[i]);
  }
  var pct = kws.length>0 ? Math.round(hits.length/kws.length*100) : 0;
  var cls = pct>=80?'g':pct>=50?'p':'m';
  var vmap = {g:'Excellent recall!',p:'Partial \u2014 review the gaps.',m:'Keep practicing.'};
  document.getElementById('fbWrap').style.display = '';
  document.getElementById('fbTop').className = 'fbtop '+cls;
  document.getElementById('fbPct').className = 'fbpct '+cls;
  document.getElementById('fbPct').textContent = pct+'%';
  document.getElementById('fbV').textContent = vmap[cls];
  document.getElementById('fbS').textContent = hits.length+' of '+kws.length+' key elements covered.';
  var hEl=document.getElementById('kwH'); hEl.innerHTML='';
  if (!hits.length) { hEl.innerHTML='<span style="font-size:.72rem;color:var(--color-text-tertiary)">None</span>'; }
  else { for(var i=0;i<hits.length;i++){var sp=document.createElement('span');sp.className='ktag h';sp.textContent='\u2713 '+hits[i];hEl.appendChild(sp);} }
  var mEl=document.getElementById('kwM'); mEl.innerHTML='';
  if (!misses.length) { mEl.innerHTML='<span style="font-size:.72rem;color:var(--color-text-tertiary)">None</span>'; }
  else { for(var i=0;i<misses.length;i++){var sp=document.createElement('span');sp.className='ktag m2';sp.textContent='\u2717 '+misses[i];mEl.appendChild(sp);} }
  document.getElementById('againEl').style.display = pct<80?'':'none';
  document.getElementById('rRuleBody').innerHTML = renderMd(c.rule);
  document.getElementById('ckBtn').disabled = true;
  document.getElementById('ckBtn').style.opacity = '.4';
});

document.getElementById('noteBtn').addEventListener('click', function() {
  var c=CARDS[idx]; var st=getState(c.id);
  st.note = document.getElementById('noteArea').value;
  setState(c.id,st);
  document.getElementById('noteBtn').textContent='Saved \u2713';
  setTimeout(function(){ document.getElementById('noteBtn').textContent='Save note'; },1500);
});

document.getElementById('prevBtn').addEventListener('click', function() { idx=(idx-1+CARDS.length)%CARDS.length; render(); });
document.getElementById('nextBtn').addEventListener('click', function() { idx=(idx+1)%CARDS.length; render(); });

document.getElementById('btnMs').addEventListener('click', function() {
  var c=CARDS[idx],st=getState(c.id);
  st.status='mastered'; var i=SRS.indexOf(st.interval); st.interval=SRS[Math.min(i+1,SRS.length-1)]||SRS[0];
  setState(c.id,st); idx=(idx+1)%CARDS.length; render();
});
document.getElementById('btnRv').addEventListener('click', function() {
  var c=CARDS[idx],st=getState(c.id);
  st.status='review'; st.interval=st.interval||SRS[0];
  setState(c.id,st); idx=(idx+1)%CARDS.length; render();
});
document.getElementById('btnDu').addEventListener('click', function() {
  var c=CARDS[idx],st=getState(c.id);
  st.status='due'; st.interval=0;
  setState(c.id,st); idx=(idx+1)%CARDS.length; render();
});

document.getElementById('tabFlip').addEventListener('click', function() {
  curMode='flip';
  document.getElementById('tabFlip').className='tab on';
  document.getElementById('tabRecall').className='tab';
  document.getElementById('modeFlip').style.display='';
  document.getElementById('modeRecall').style.display='none';
  render();
});
document.getElementById('tabRecall').addEventListener('click', function() {
  curMode='recall';
  document.getElementById('tabRecall').className='tab on';
  document.getElementById('tabFlip').className='tab';
  document.getElementById('modeRecall').style.display='';
  document.getElementById('modeFlip').style.display='none';
  render();
});

render();
</script>
